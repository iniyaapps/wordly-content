name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON content
        run: node tools/validate.mjs

      - name: Check every JSON file parses
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail

      - name: Check files are UTF-8 without a BOM
        run: |
          fail=0
          while IFS= read -r f; do
            if head -c 3 "$f" | grep -q $'\xef\xbb\xbf'; then
              echo "::error file=$f::file starts with a UTF-8 BOM"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail
